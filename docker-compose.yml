version: "3.8"

services:
  api:
    build: .
    image: algoplatform:latest
    container_name: algoplatform
    ports:
      - "8000:8000"
    environment:
      - ALGOPLATFORM_LOG_LEVEL=INFO
      - ALGOPLATFORM_DATA_DIR=/app/data
    volumes:
      - algo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  algo_data:
