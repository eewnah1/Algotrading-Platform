services:
  - type: web
    name: algoplatform
    runtime: python
    plan: free
    repo: https://github.com/eewnah1/Algotrading-Platform.git
    branch: main
    buildCommand: pip install -e .
    startCommand: python3 -m uvicorn algoplatform.api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
